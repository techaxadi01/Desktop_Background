<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Combat Desktop - Live Interactive Wallpaper</title>

  <!-- Local Tailwind CSS Engine (Offline / Lively Wallpaper Reliable) -->
  <script src="tailwind.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              rotor: '#00ff88',
              emerald: '#10b981',
              dark: '#05080c',
              card: 'rgba(10, 15, 22, 0.75)',
              border: 'rgba(52, 211, 153, 0.25)'
            }
          }
        }
      }
    }
  </script>

  <!-- Local Lucide Icons Engine (Offline / Lively Wallpaper Reliable) -->
  <script src="lucide.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css?v=fix4">
</head>

<body class="bg-cyber-dark text-slate-100 overflow-hidden select-none">

  <!-- Background Image & Atmospheric Lighting Layer -->
  <div id="bg-container"></div>
  <div id="bg-overlay"></div>

  <!-- Main Wallpaper Canvas: Uses template.png coordinates (Pointer events none on background, auto on widgets) -->
  <div id="wallpaper-root" class="relative z-10 w-screen h-screen pointer-events-none overflow-hidden font-sans">

    <!-- ========================================== -->
    <!-- 1. CLOCK WIDGET (Top Center: Matches Calendar Width 286px - +10%) -->
    <!-- ========================================== -->
    <div id="clock-container"
      class="wallpaper-widget pointer-events-auto absolute left-[38.5%] top-[12px] w-[286px] clock-widget group z-40">
      <!-- Main Clock Card (Click to open calendar) -->
      <div id="clock-main-card"
        class="glass-panel px-4.5 py-3 rounded-2xl border-emerald-500/30 hover:border-emerald-400/70 cursor-pointer text-center relative overflow-hidden transition-all shadow-xl active:scale-[0.99]">
        <div class="flex items-center justify-center gap-1.5">
          <!-- Digital Time (Without Seconds) -->
          <span id="clock-time"
            class="font-display text-[2.75rem] md:text-[3.3rem] font-bold text-white neon-clock-glow leading-none">00:00</span>
          <span id="clock-ampm" class="text-[13px] font-sans font-semibold text-emerald-300 ml-0.5"></span>
        </div>
        <!-- Date: DDD, DD MMM YYYY -->
        <div class="text-[15.5px] text-emerald-200 font-semibold tracking-wide mt-1.5">
          <span id="clock-date">Wed, 23 Sep 2026</span>
        </div>
      </div>

      <!-- Full Month Calendar Dropdown (Matches Clock Width 100%) -->
      <div id="calendar-dropdown"
        class="calendar-dropdown glass-panel p-3 rounded-xl border-emerald-500/40 shadow-2xl z-50">
        <!-- Calendar Header (Month, Year, Prev/Next) -->
        <div class="flex items-center justify-between pb-1.5 mb-1.5 border-b border-white/10 text-[13px]">
          <button id="cal-prev-btn"
            class="p-1 rounded hover:bg-emerald-500/20 text-gray-400 hover:text-emerald-300 transition-colors cursor-pointer">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <div class="flex items-center gap-1 cursor-pointer" id="cal-today-btn">
            <span id="cal-month-name" class="font-bold text-white font-mono text-[13px]">Month</span>
            <span id="cal-year-val" class="font-mono text-emerald-400 text-[13px] font-semibold">2026</span>
          </div>
          <button id="cal-next-btn"
            class="p-1 rounded hover:bg-emerald-500/20 text-gray-400 hover:text-emerald-300 transition-colors cursor-pointer">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Weekday Labels -->
        <div class="grid grid-cols-7 gap-0.5 text-center font-mono text-[10px] text-emerald-400/80 font-semibold mb-1">
          <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
        </div>

        <!-- Days Grid (Injected by app.js) -->
        <div id="cal-days-grid" class="grid grid-cols-7 gap-0.5 text-center">
          <!-- Calendar cells injected dynamically -->
        </div>

        <!-- Footer / Today Shortcut -->
        <div
          class="mt-2 pt-1.5 border-t border-white/5 flex items-center justify-between text-[10px] text-gray-400 font-mono">
          <span class="flex items-center gap-1 text-emerald-400">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span> Today
          </span>
          <span id="cal-today-label" class="text-gray-300"></span>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. STREAK WIDGET (Month Name + Day Boxes - Compact Mini Heatmap) -->
    <!-- ========================================== -->
    <div id="streak-container"
      class="wallpaper-widget pointer-events-auto absolute left-[59.5%] top-[12px] w-[104px] z-30 transition-all">
      <div id="streak-card"
        class="glass-panel p-2 rounded-xl border-emerald-500/25 flex flex-col justify-between shadow-xl cursor-pointer">
        <!-- Month Header with Previous / Next navigation -->
        <div id="streak-header"
          class="flex items-center justify-between pb-1 border-b border-white/10 select-none">
          <button id="streak-prev-btn"
            class="hidden w-4 h-4 items-center justify-center text-gray-400 hover:text-emerald-300 hover:bg-white/10 rounded transition-colors cursor-pointer flex-shrink-0">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
          <span id="streak-month-title"
            class="font-bold text-white font-mono text-[9.5px] tracking-wider uppercase text-center truncate flex-1 px-1 select-none">
            September
          </span>
          <button id="streak-next-btn"
            class="hidden w-4 h-4 items-center justify-center text-gray-400 hover:text-emerald-300 hover:bg-white/10 rounded transition-colors cursor-pointer flex-shrink-0 opacity-30 pointer-events-none">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Weekday Headers (Visible only in expanded mode) -->
        <div id="streak-weekdays-row" class="hidden grid-cols-7 gap-1 text-center pt-1.5 pb-0.5 border-b border-white/5 select-none">
          <span class="text-[8px] font-mono text-gray-400 font-bold">Mo</span>
          <span class="text-[8px] font-mono text-gray-400 font-bold">Tu</span>
          <span class="text-[8px] font-mono text-gray-400 font-bold">We</span>
          <span class="text-[8px] font-mono text-gray-400 font-bold">Th</span>
          <span class="text-[8px] font-mono text-gray-400 font-bold">Fr</span>
          <span class="text-[8px] font-mono text-gray-400 font-bold">Sa</span>
          <span class="text-[8px] font-mono text-gray-400 font-bold">Su</span>
        </div>

        <!-- Month Day Boxes Grid -->
        <div id="streak-days-grid" class="grid grid-cols-7 gap-1 justify-items-center pt-1">
          <!-- Injected by app.js -->
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. TIME TABLE WIDGET (Day-Wise, 2-Column: Time & Subject) -->
    <!-- ========================================== -->
    <div id="timetable-container"
      class="wallpaper-widget pointer-events-auto absolute right-[1%] top-[12px] w-[286px] z-30">
      <div id="timetable-card"
        class="glass-panel p-3 rounded-2xl border-emerald-500/25 hover:border-emerald-400/50 w-full flex flex-col group overflow-hidden cursor-pointer shadow-xl transition-colors duration-200 relative">
        <!-- Top Bar: Day on Top -->
        <div class="flex items-center justify-between border-b border-white/10 pb-1.5 mb-1.5" id="tt-header-bar">
          <div class="flex items-center gap-2">
            <span id="tt-active-day-title"
              class="font-display font-bold text-white tracking-wider text-xs md:text-sm uppercase">Wednesday</span>
            <span id="tt-day-status-badge"
              class="text-[9px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-mono border border-emerald-500/30">TODAY</span>
          </div>
        </div>

        <!-- Timetable Slots: STRICTLY Time and Subject in 2 Columns (Zero Scrollbar) -->
        <div id="tt-slots-list" class="space-y-1.5 mt-0.5">
          <!-- Injected dynamically by app.js -->
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 4. DAILY TASKS WIDGET ("MY DAY" Checklist - Matches Streak Width) -->
    <!-- ========================================== -->
    <div id="scheduler-container"
      class="wallpaper-widget pointer-events-auto absolute z-30 transition-all duration-300"
      style="width: 260px;">
      <div id="my-day-card"
        class="glass-panel rounded-xl border-emerald-500/25 flex flex-col shadow-xl overflow-hidden transition-all duration-300 w-full">
        <!-- Header (Click to minimize / expand) -->
        <div id="my-day-header"
          class="flex items-center justify-between px-2.5 h-[36px] flex-shrink-0 cursor-pointer hover:bg-white/[0.04] transition-colors select-none">
          <div class="flex items-center gap-1.5 min-w-0">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400 flex-shrink-0 my-day-icon"></i>
            <span class="font-bold text-white font-mono text-sm tracking-wider uppercase truncate">MY DAY</span>
          </div>
          <button id="my-day-toggle-btn"
            class="w-4 h-4 flex items-center justify-center text-gray-400 hover:text-white transition-transform duration-200 cursor-pointer flex-shrink-0">
            <i id="my-day-chevron" data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform duration-300" style="transform: rotate(180deg);"></i>
          </button>
        </div>

        <!-- Collapsible Checklist Body (Dynamic height down to reserved rows at bottom) -->
        <div id="my-day-body" class="px-2.5 pb-2.5 flex-1 min-h-0 flex flex-col">
          <div id="my-day-tasks-list" class="space-y-1.5 flex-1 min-h-0 overflow-y-auto pr-1">
            <!-- Daily tasks injected from txt file by app.js -->
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 5. TODO WIDGET (No Title Header) -->
    <!-- ========================================== -->
    <div id="todo-container"
      class="wallpaper-widget pointer-events-auto absolute right-[1%] top-[242px] w-[286px] z-40">
      <div class="glass-panel p-2 rounded-2xl border-emerald-500/25 h-full flex flex-col relative overflow-visible">
        <!-- Tabs & Count Strip -->
        <div class="flex items-center justify-between border-b border-white/5 pb-1.5 mb-2 text-[10px]">
          <div class="flex items-center gap-2">
            <button
              class="task-tab-btn font-medium text-emerald-400 border-b-2 border-emerald-400 pb-0.5 cursor-pointer transition-colors"
              data-tab="due-soon">Due Soon</button>
            <button
              class="task-tab-btn font-medium text-gray-400 border-b-2 border-transparent pb-0.5 hover:text-gray-200 cursor-pointer transition-colors"
              data-tab="planned">Planned</button>
            <button
              class="task-tab-btn font-medium text-gray-400 border-b-2 border-transparent pb-0.5 hover:text-gray-200 cursor-pointer transition-colors"
              data-tab="all">All</button>
            <button
              class="task-tab-btn font-medium text-gray-400 border-b-2 border-transparent pb-0.5 hover:text-gray-200 cursor-pointer transition-colors"
              data-tab="done">Done</button>
          </div>
          <span id="task-count"
            class="text-[9px] font-mono px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">0</span>
        </div>

        <!-- Task List Scrollable -->
        <div id="task-list" class="flex-1 space-y-1 overflow-y-auto pr-1 pb-1">
          <!-- Injected by JS -->
        </div>

        <!-- Add Task Form -->
        <form id="add-task-form" class="mt-1.5 pt-1.5 border-t border-white/10 flex flex-col gap-1.5">
          <!-- Row 1: Task Input & Add Button (Single-click responsive typing) -->
          <div class="flex gap-1.5 items-center relative" id="task-input-container">
            <input id="new-task-input" type="text" placeholder="Add task..."
              class="flex-1 min-w-0 h-[30px] bg-black/50 border border-white/10 focus:border-emerald-400 rounded-lg px-2.5 text-xs text-white placeholder-gray-500 outline-none transition-colors select-text cursor-text"
              autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button type="submit" id="add-task-submit-btn"
              class="h-[30px] w-[30px] rounded-lg bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white transition-all cursor-pointer flex-shrink-0 flex items-center justify-center shadow-md border border-emerald-400/30">
              <i data-lucide="plus" class="w-4 h-4 stroke-[2.5]"></i>
            </button>
          </div>

          <!-- Row 2: Category Selector & Designed Due Date Capsule -->
          <div class="flex items-center gap-1.5 relative">
            <!-- Custom Cyber Category Capsule (100% In-Page & Wallpaper Reliable) -->
            <div id="category-picker-capsule"
              class="relative flex-1 min-w-0 flex items-center justify-between h-[26px] bg-black/60 border border-white/10 border-l-[3px] border-l-emerald-400 rounded-lg px-2 text-[10px] text-emerald-300 transition-all cursor-pointer select-none">
              <span id="category-picker-display" class="truncate font-sans font-medium select-none pointer-events-none">● College Task</span>
              <i data-lucide="chevron-down" id="category-picker-chevron" class="w-3 h-3 text-gray-400 flex-shrink-0 transition-transform pointer-events-none ml-1"></i>
            </div>

            <!-- In-Page Category Dropdown -->
            <div id="todo-category-dropdown"
              class="hidden absolute top-[30px] left-0 w-[155px] glass-panel border border-emerald-500/40 rounded-xl p-1.5 shadow-2xl z-50 flex-col gap-1 text-[10px]">
              <button type="button" class="todo-cat-opt-btn flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-emerald-500/20 text-emerald-300 font-sans transition-all cursor-pointer text-left w-full select-none" data-value="College Task">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-sm shadow-emerald-400/50"></span> College Task
              </button>
              <button type="button" class="todo-cat-opt-btn flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-amber-500/20 text-amber-300 font-sans transition-all cursor-pointer text-left w-full select-none" data-value="College Exams">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400 shadow-sm shadow-amber-400/50"></span> College Exams
              </button>
              <button type="button" class="todo-cat-opt-btn flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-rose-500/20 text-rose-300 font-sans transition-all cursor-pointer text-left w-full select-none" data-value="Last Date for Stuff">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-400 shadow-sm shadow-rose-400/50"></span> Last Date for Stuff
              </button>
              <button type="button" class="todo-cat-opt-btn flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-purple-500/20 text-purple-300 font-sans transition-all cursor-pointer text-left w-full select-none" data-value="Competitive Exams">
                <span class="w-1.5 h-1.5 rounded-full bg-purple-400 shadow-sm shadow-purple-400/50"></span> Competitive Exams
              </button>
            </div>

            <!-- Synchronized native select for full form/script compatibility -->
            <select id="new-task-category" class="hidden">
              <option value="College Task" selected>College Task</option>
              <option value="College Exams">College Exams</option>
              <option value="Last Date for Stuff">Last Date for Stuff</option>
              <option value="Competitive Exams">Competitive Exams</option>
            </select>

            <!-- Styled Date Picker Capsule -->
            <div id="date-picker-capsule"
              class="relative flex items-center h-[26px] rounded-lg bg-black/60 border border-white/10 hover:border-emerald-500/40 focus-within:border-emerald-400/80 transition-all px-2 gap-1.5 cursor-pointer w-[126px] flex-shrink-0 select-none">
              <i data-lucide="calendar" id="date-picker-icon" class="w-3 h-3 text-emerald-400/70 flex-shrink-0 pointer-events-none transition-colors"></i>
              <span id="date-picker-display" class="flex-1 text-[10px] text-gray-300 font-mono tracking-tight select-none pointer-events-none whitespace-nowrap">dd / mm / yyyy</span>
              <i data-lucide="calendar" id="date-picker-trailing-icon" class="w-3 h-3 text-gray-400/60 flex-shrink-0 pointer-events-none transition-colors"></i>
              <button type="button" id="clear-task-date-btn"
                class="hidden text-gray-400 hover:text-rose-400 p-0.5 rounded cursor-pointer transition-colors flex-shrink-0 z-20">
                <i data-lucide="x" class="w-2.5 h-2.5"></i>
              </button>
              <input id="new-task-date" type="hidden" value="">
            </div>

            <!-- In-Page Cyber Calendar Dropdown (100% Offline & Desktop Wallpaper Reliable) -->
            <div id="todo-calendar-dropdown"
              class="hidden absolute top-[30px] right-0 w-[240px] bg-[#070d14]/95 border border-emerald-500/40 rounded-xl p-2.5 shadow-2xl backdrop-blur-xl z-50 flex-col">
              <!-- Quick Date Pills -->
              <div class="flex items-center gap-1 pb-2 mb-2 border-b border-white/10 text-[9px] font-mono">
                <button type="button" class="todo-quick-date-btn flex-1 py-1 rounded bg-white/5 hover:bg-emerald-500/20 text-gray-300 hover:text-emerald-300 border border-white/5 transition-colors cursor-pointer" data-days="0">Today</button>
                <button type="button" class="todo-quick-date-btn flex-1 py-1 rounded bg-white/5 hover:bg-emerald-500/20 text-gray-300 hover:text-emerald-300 border border-white/5 transition-colors cursor-pointer" data-days="1">Tmrw</button>
                <button type="button" class="todo-quick-date-btn flex-1 py-1 rounded bg-white/5 hover:bg-emerald-500/20 text-gray-300 hover:text-emerald-300 border border-white/5 transition-colors cursor-pointer" data-days="2">+2d</button>
                <button type="button" class="todo-quick-date-btn flex-1 py-1 rounded bg-white/5 hover:bg-emerald-500/20 text-gray-300 hover:text-emerald-300 border border-white/5 transition-colors cursor-pointer" data-days="7">+1wk</button>
              </div>

              <!-- Month Navigation Header -->
              <div class="flex items-center justify-between pb-1.5 text-xs text-white">
                <button type="button" id="todo-cal-prev-btn" class="w-5 h-5 flex items-center justify-center rounded hover:bg-white/10 text-gray-400 hover:text-emerald-400 transition-colors cursor-pointer">
                  <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                </button>
                <span id="todo-cal-month-title" class="font-mono font-bold text-[11px] tracking-wide text-emerald-300">September 2026</span>
                <button type="button" id="todo-cal-next-btn" class="w-5 h-5 flex items-center justify-center rounded hover:bg-white/10 text-gray-400 hover:text-emerald-400 transition-colors cursor-pointer">
                  <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </button>
              </div>

              <!-- Weekdays -->
              <div class="grid grid-cols-7 gap-0.5 text-center text-[9px] font-mono text-emerald-400/80 font-semibold mb-1">
                <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
              </div>

              <!-- Days Grid -->
              <div id="todo-cal-days-grid" class="grid grid-cols-7 gap-1 text-center justify-items-center">
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 6. CONSOLE WIDGET (Lower Right: Classroom, Christ University, Tools & Visibility) -->
    <!-- ========================================== -->
    <div id="console-container"
      class="wallpaper-widget pointer-events-auto absolute right-[1%] w-[286px] h-[52px] z-30">
      <div
        class="glass-panel px-3.5 py-2 rounded-2xl border-emerald-500/25 h-full flex items-center justify-between shadow-xl relative">
        <!-- Left Group: Dynamic Console Links (Loaded from links.js / links.json / links.txt) -->
        <div id="console-links-group" class="flex items-center gap-2 overflow-x-auto py-0.5"
          style="scrollbar-width: none;">
          <!-- 1. Google Classroom (Updated to /u/1/) -->
          <a href="https://classroom.google.com/u/1/" target="_blank" rel="noopener noreferrer"
            class="w-9 h-9 rounded-xl flex items-center justify-center text-gray-300 hover:text-emerald-300 hover:bg-emerald-500/20 border border-white/5 hover:border-emerald-500/40 transition-all cursor-pointer group shadow-md flex-shrink-0">
            <i data-lucide="graduation-cap" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          </a>

          <!-- 2. College Site (Christ University Portal) -->
          <a href="https://cue.christuniversity.in/" target="_blank" rel="noopener noreferrer"
            class="w-9 h-9 rounded-xl flex items-center justify-center text-gray-300 hover:text-emerald-300 hover:bg-emerald-500/20 border border-white/5 hover:border-emerald-500/40 transition-all cursor-pointer group shadow-md flex-shrink-0">
            <i data-lucide="landmark" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          </a>
        </div>

        <!-- Right Action Buttons Group -->
        <div class="flex items-center gap-1.5 flex-shrink-0 ml-2">
          <!-- Visibility / View Icon -->
          <button id="dock-focus-btn"
            class="w-9 h-9 rounded-xl flex items-center justify-center text-gray-300 hover:text-emerald-300 hover:bg-emerald-500/20 border border-white/5 hover:border-emerald-500/40 transition-all cursor-pointer group shadow-md">
            <i data-lucide="eye" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- TIMETABLE MODAL (TT.jpeg Lightbox - 60% Viewport Bounds, Reduced Blur, Emerald Glass Widget Padding) -->
  <div id="timetable-modal" class="fixed inset-0 z-50 modal-backdrop hidden items-center justify-center p-3 sm:p-5 cursor-pointer">
    <div id="tt-modal-card"
      class="glass-panel p-1.5 rounded-xl flex items-center justify-center relative select-none cursor-pointer transition-all duration-200"
      style="max-width: 60vw; max-height: 60vh; width: min(60vw, calc((60vh - 12px) * 2.855 + 12px)); height: auto; background: linear-gradient(135deg, rgba(16, 185, 129, 0.16), rgba(10, 25, 28, 0.78)); border: 1px solid rgba(52, 211, 153, 0.45); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 28px rgba(16, 185, 129, 0.35);">
      <!-- Full Image Display with Fallback (Equal 6px Green Glassy Padding on All 4 Sides) -->
      <img id="tt-image-element" src="TT.jpeg" alt="College Timetable"
        class="w-full h-auto block rounded-lg shadow-md border border-emerald-500/25 transition-transform hover:scale-[1.003]"
        onerror="this.onerror=null; if (!this.src.includes('TT1.jpeg')) this.src='TT1.jpeg';">
    </div>
  </div>

  <!-- Automatic Backup Recovery, Configurable Links & Main JavaScript Engine -->
  <script src="data-backup.js"></script>
  <script id="daily-tasks-script-tag" src="daily_tasks.js"></script>
  <script id="streak-history-script-tag" src="streak_history.js"></script>
  <script id="links-script-tag" src="links.js"></script>
  <script id="timetable-script-tag" src="timetable.js"></script>
  <script src="app.js?v=fix9"></script>
</body>

</html>
